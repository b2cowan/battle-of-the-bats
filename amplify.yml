version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9
        - rm -rf node_modules
        - pnpm install
    build:
      commands:
        - echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.production
        - echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env.production
        - echo "RESEND_FROM=$RESEND_FROM" >> .env.production
        - echo "PLATFORM_ADMIN_EMAILS=$PLATFORM_ADMIN_EMAILS" >> .env.production
        - echo "OBSERVABILITY_ENV=$OBSERVABILITY_ENV" >> .env.production
        - echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env.production
        - echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env.production
        - echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" >> .env.production
        # Web Push (VAPID). Public key is inlined into the client bundle at build
        # time (browser subscribe needs it); private key + email are read by the
        # server at runtime to sign pushes. Without these, push silently no-ops.
        - echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$NEXT_PUBLIC_VAPID_PUBLIC_KEY" >> .env.production
        - echo "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY" >> .env.production
        - echo "VAPID_EMAIL=$VAPID_EMAIL" >> .env.production
        # Scheduler machine-auth (mig 183 pg_cron ticks): must MATCH the Vault
        # app_cron_secret in this environment's Supabase project. Unset ⇒ the
        # machine path on the trigger routes is disabled (fail-closed).
        - echo "CRON_SECRET=$CRON_SECRET" >> .env.production
        # NOTE: UNSUBSCRIBE_SECRET is deliberately NOT echoed here. The console var is set
        # (all-branches + dev), but production has been signing links with the insecure code
        # fallback because it was never on this copy list. Activating the console value flips
        # the effective secret and breaks unsubscribe links already sent — so that fix is
        # decoupled from the scheduler work and will ship as its own deliberate change (ideally
        # paired with a fresh email send so live links go out re-signed). See SCHEDULED_JOBS plan.
        # Color-token guardrail — unbypassable backstop to the local pre-commit hook.
        # Fail the deploy if any guarded file carries a hardcoded color that should be a
        # var(--token), so a rebrand stays a single central edit. `--scope=all` runs every
        # scope (public / operator / consumer / marketing / shared / inline tsx) AND the
        # coverage assertion, so a scope or a stylesheet added later is guarded here with
        # no edit to this file. Baselines let existing debt through, block only NEW literals.
        - node scripts/check-public-tokens.mjs --scope=all
        # Date-correctness guardrail. Production runs UTC while orgs schedule in Toronto, so
        # any "what day is it / overdue / days until" answer taken from the runtime zone is a
        # day late every evening — and invisible on a dev box, which runs on Toronto time.
        # Baseline is ZERO: every occurrence was fixed 2026-07-26, so any new one fails here.
        - node scripts/check-date-correctness.mjs
        # Schema-parity gate. check-prod-migration-drift.mjs compares only whether tables and
        # columns EXIST — it cannot see defaults, nullability, constraints or indexes, and so
        # reported "in sync" while prod defaulted new tournaments to `completed`, hid them from
        # the directory, and lacked the games→division foreign key. This runs offline against
        # the committed snapshots and fails when dev/prod diverge in a NEW way.
        # Master-only enforcement, same split as check:migrations in the release flow: dev is
        # SUPPOSED to run ahead of prod between "migrate dev, test" and "promote + migrate prod"
        # — that gap is the staging workflow, not drift. Failing dev builds on it blocked every
        # release with a pending migration (2026-07-29). Report-only off master; hard gate on it.
        - if [ "$AWS_BRANCH" = "master" ]; then node scripts/check-schema-parity.mjs; else node scripts/check-schema-parity.mjs --list || true; fi
        # Webpack production build (next build --webpack) uses far more heap than the
        # Turbopack default and OOMs the build worker on the 8GiB Standard instance.
        # NODE_OPTIONS is inherited by Next's build workers; raise the old-space limit.
        # Bumped 6144 -> 7168 (2026-08-03): this release's new page/component surface
        # (Tournament Admin Sandbox, coach helper pages) pushed a clean compile past the
        # point it used to fail at CSS/import errors, straight into an OOM SIGKILL during
        # the heavier page-generation/cache-write phase. If 7168 still OOMs, the next lever
        # is a bigger Amplify build compute instance (console-only setting), not a higher number here.
        - NODE_OPTIONS=--max-old-space-size=7168 pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - .next/cache/**/*

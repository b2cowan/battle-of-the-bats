<title>Owner Morning Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-minute "Today" view first (figures band, ordered priorities, waiting on you, momentum, goals),
   then detail tabs. Every figure comes from the artifact's database; nothing is typed into this page. */
:root {
  --bg: #f5f7f6; --surface: #ffffff; --ink: #17211d; --muted: #5a6862; --line: #d9e1dd;
  --accent: #1f6b4f; --accent-soft: #e2efe9; --tech: #2b5a86; --tech-soft: #e3ecf5;
  --ok: #1f6b4f; --ok-bg: #e2efe9; --warn: #8a5800; --warn-bg: #faefd6; --stop: #a3362a; --stop-bg: #f8e3e0; --idle: #55615c; --idle-bg: #e8ecea;
  --pip-off: #cfd8d3;
  --display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101614; --surface: #171f1c; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
  --accent: #62c69c; --accent-soft: #1b2e26; --tech: #8ab8e6; --tech-soft: #1b2836;
  --ok: #62c69c; --ok-bg: #173026; --warn: #e3b45e; --warn-bg: #33290f; --stop: #ef8d80; --stop-bg: #3a1c18; --idle: #a7b3ae; --idle-bg: #232c29;
  --pip-off: #37433e;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101614; --surface: #171f1c; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
  --accent: #62c69c; --accent-soft: #1b2e26; --tech: #8ab8e6; --tech-soft: #1b2836;
  --ok: #62c69c; --ok-bg: #173026; --warn: #e3b45e; --warn-bg: #33290f; --stop: #ef8d80; --stop-bg: #3a1c18; --idle: #a7b3ae; --idle-bg: #232c29;
  --pip-off: #37433e;
  color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 0.98rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.head { display: flex; flex-direction: column; gap: 8px; }
.stale { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; font-weight: 500; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-block: -8px; }
.tabs nav { display: flex; gap: 2px 6px; flex-wrap: wrap; padding-block: 8px; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.92rem; padding: 6px 12px; border-radius: 999px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="true"] { background: var(--ink); color: var(--bg); }

.view { display: flex; flex-direction: column; gap: 28px; }
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 32px; }
@media (max-width: 820px) { .cols, .two { grid-template-columns: 1fr; } }

.figures { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.figures div { padding: 14px 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.figures div:first-child { border-left: 0; }
.figures b { font-family: var(--display); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.figures span { font-size: 0.84rem; color: var(--muted); }
@media (max-width: 640px) {
  .figures { grid-template-columns: 1fr; }
  .figures div { border-left: 0; border-top: 1px solid var(--line); flex-direction: row; align-items: baseline; gap: 12px; padding: 11px 16px; }
  .figures div:first-child { border-top: 0; }
  .figures b { font-size: 1.25rem; min-width: 3.4ch; }
}

.tag { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }
.tag.ok { color: var(--ok); background: var(--ok-bg); }
.tag.warn { color: var(--warn); background: var(--warn-bg); }
.tag.stop { color: var(--stop); background: var(--stop-bg); }
.tag.idle { color: var(--idle); background: var(--idle-bg); }
.tag.tech { color: var(--tech); background: var(--tech-soft); }

ol.prio { list-style: none; margin: 0; padding: 0; counter-reset: p; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
ol.prio li { counter-increment: p; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); padding: 14px 16px 14px 8px; border-top: 1px solid var(--line); }
ol.prio li:first-child { border-top: 0; }
ol.prio li::before { content: counter(p); font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--accent); text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums; }
ol.prio .t { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
ol.prio .w { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
ol.prio .l { font-size: 0.9rem; margin-top: 4px; }

ul.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.rows li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
ul.rows .t { font-weight: 500; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
ul.rows .s { color: var(--muted); font-size: 0.85rem; }

.goal { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) minmax(0, 1fr); gap: 6px 20px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.goal:first-of-type { border-top: 1px solid var(--line); }
.goal .h b { font-family: var(--display); display: block; }
.goal .h span { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.pip { width: 14px; height: 14px; border-radius: 3px; background: var(--pip-off); }
.pip.live { background: var(--accent); }
.pip.built { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.pip.prog { background: var(--warn-bg); box-shadow: inset 0 0 0 2px var(--warn); }
.goal .c { font-size: 0.85rem; color: var(--muted); }
.goal .c strong { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .goal { grid-template-columns: 1fr; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); align-items: center; }
.legend .pip { display: inline-block; vertical-align: -2px; margin-right: 5px; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 9px 14px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.i { font-weight: 600; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; color: var(--muted); }
</style>

<div class="wrap">
  <header class="head">
    <span class="eyebrow">FieldLogicHQ · owner brief</span>
    <h1 id="headline">Morning Brief</h1>
    <p class="muted" id="asof">Loading the latest brief.</p>
    <p class="stale" id="stale" hidden></p>
  </header>

  <div class="tabs"><nav aria-label="Views">
    <a href="#today">Today</a>
    <a href="#product">Product</a>
    <a href="#technology">Technology</a>
    <a href="#projects">Projects</a>
  </nav></div>

  <main id="main">
    <div class="empty" id="empty">The brief shows where things stand, today's priorities in order, what is waiting on you, and progress against the roadmap. It fills in as soon as the data arrives.</div>
  </main>
</div>

<script>
(function () {
  var D = {};            // docs from the "brief" collection, by id
  var main = document.getElementById("main");
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = String(text); return e; }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function day(iso) { if (!iso) return ""; var p = iso.slice(0, 10).split("-"); return Number(p[2]) + " " + MONTHS[Number(p[1]) - 1]; }
  function clock(d) { var hr = d.getHours(), m = d.getMinutes(); var ap = hr < 12 ? "a.m." : "p.m."; hr = hr % 12 || 12; return hr + ":" + (m < 10 ? "0" : "") + m + " " + ap; }
  function todayIso() { var d = new Date(); var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd; }
  function daysBetween(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function link(url, label) { if (!url || !/^https:\/\//.test(url)) return null; var a = h("a", "", label); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; }
  function tag(cls, text) { return h("span", "tag " + cls, text); }
  function items(id) { return (D[id] && D[id].items) || []; }

  var STATUS = { moving: ["ok", "Moving"], waiting: ["warn", "Waiting on you"], quiet: ["stop", "Gone quiet"], parked: ["idle", "Parked"], closed: ["idle", "Closed"] };
  function pipClass(s) { s = (s || "").toLowerCase(); return s === "live" ? "live" : s === "built" ? "built" : s === "in progress" ? "prog" : ""; }
  function statusTag(s) { var c = pipClass(s); return tag(c === "live" ? "ok" : c === "built" ? "ok" : c === "prog" ? "warn" : "idle", s || "Not started"); }

  function section(title, sub) { var b = h("section", "block"); add(b, h("h2", "", title)); if (sub) add(b, h("p", "muted small", sub)); return b; }

  function figures() {
    var p = (D.meta && D.meta.production) || {};
    var f = h("div", "figures");
    function cell(n, label) { var c = h("div"); add(c, h("b", "", n === null || n === undefined ? "–" : n), h("span", "", label)); return c; }
    add(f, cell(p.ahead, "changes not yet live"), cell(p.pendingSteps, "database steps owed to production"),
      cell(p.daysSinceRelease, "days since the last release" + (p.lastRelease ? " (" + day(p.lastRelease) + ")" : "")),
      cell(D.meta ? D.meta.walksOwed : null, "walks waiting on you"));
    return f;
  }

  function priorities() {
    var b = section("Today, in this order");
    var list = items("priorities");
    if (!list.length) return add(b, h("div", "empty", "No priorities were set at the last refresh."));
    var ol = h("ol", "prio");
    list.forEach(function (p) {
      var li = h("li"), body = h("div");
      var t = h("div", "t"); add(t, h("span", "", p.title), p.kind ? tag("idle", p.kind) : null);
      add(body, t, p.why ? h("div", "w", p.why) : null);
      var a = link(p.link, p.linkLabel || "Open"); if (a) add(body, add(h("div", "l"), a));
      add(ol, add(li, body));
    });
    return add(b, ol);
  }

  function waiting() {
    var list = items("walks");
    var b = section("Waiting on you", list.length ? plural(list.length, "walk", "walks") + " published and not yet recorded as walked." : null);
    if (!list.length) return add(b, h("p", "muted", "No walks are owed."));
    var ul = h("ul", "rows");
    list.forEach(function (w) {
      var li = h("li"), t = h("div", "t");
      add(t, link(w.link, "§" + w.section) || h("span", "", "§" + w.section), h("span", "", w.title), w.recorded ? null : tag("warn", "No result recorded"));
      var bits = []; if (w.steps) bits.push(w.steps + " steps"); if (w.published) bits.push("published " + day(w.published));
      add(ul, add(li, t, bits.length ? h("div", "s", bits.join(" · ")) : null));
    });
    return add(b, ul);
  }

  function momentum() {
    var all = items("projects"), today = D.meta ? D.meta.date : todayIso();
    var b = section("Momentum", "Worked out from the history of each project's plan. Quiet means no change for more than seven days.");
    var cols = h("div", "cols");
    function col(title, list, line) {
      var c = h("div", "block"); add(c, h("h3", "", title + " (" + list.length + ")"));
      if (!list.length) return add(c, h("p", "muted small", "None."));
      var ul = h("ul", "rows");
      list.forEach(function (p) { var li = h("li"); add(li, add(h("div", "t"), h("span", "", p.name), p.auto ? tag("idle", "Unregistered") : null), h("div", "s", line(p))); add(ul, li); });
      return add(c, ul);
    }
    var moving = all.filter(function (p) { return p.status === "moving"; }).sort(function (a, b2) { return b2.commitsThisWeek - a.commitsThisWeek; });
    var shown = moving.slice(0, 8);
    var quiet = all.filter(function (p) { return p.status === "quiet" || p.status === "waiting"; });
    var parked = all.filter(function (p) { return p.status === "parked"; });
    add(cols,
      col("Moving this week", shown, function (p) { return plural(p.commitsThisWeek, "change", "changes") + " this week" + (p.uncommitted ? " · work not yet committed" : "") + (p.walksOwed && p.walksOwed.length ? " · " + plural(p.walksOwed.length, "walk", "walks") + " owed" : ""); }),
      col("Gone quiet", quiet, function (p) {
        var s = "Stopped " + plural(p.quietDays, "day", "days") + " ago (" + day(p.last) + ")";
        if (p.status === "waiting") s += " · waiting on your walk";
        if (p.overtakenBy && p.overtakenBy.length) s += " · started since: " + p.overtakenBy.join(", ");
        return s; }),
      col("Parked on purpose", parked, function (p) { return (p.parked && p.parked.reason) || "No reason recorded."; }));
    add(b, cols);
    var extra = moving.length - shown.length, settled = D.meta ? D.meta.settledNotShown : 0, notes = [];
    if (extra > 0) notes.push(extra + " more moving projects are on the Projects tab.");
    if (settled) notes.push(settled + " finished plans with no open task are left off.");
    if (notes.length) add(b, h("p", "muted small", notes.join(" ")));
    return b;
  }

  function pips(list) { var d = h("div", "pips"); list.forEach(function (r) { var p = h("span", "pip " + pipClass(r.status)); p.title = r.item + " · " + r.status; add(d, p); }); return d; }
  function goals() {
    var road = items("roadmap");
    var b = section("Progress against the roadmap", "One square per roadmap item. Counts, not percentages.");
    if (!road.length) return add(b, h("p", "muted", "The roadmap has no items yet."));
    var lg = h("div", "legend");
    [["live", "Live"], ["built", "Built, not yet live"], ["prog", "In progress"], ["", "Not started"]].forEach(function (x) { var s = h("span"); add(s, h("span", "pip " + x[0])); s.appendChild(document.createTextNode(x[1])); add(lg, s); });
    add(b, lg);
    var seen = [];
    road.forEach(function (r) { if (seen.indexOf(r.horizon) < 0) seen.push(r.horizon); });
    seen.forEach(function (name) {
      var rows = road.filter(function (r) { return r.horizon === name; });
      var g = h("div", "goal"), hd = h("div", "h");
      add(hd, h("b", "", name), h("span", "", rows[0].confidence || ""));
      function side(label, track) {
        var t = rows.filter(function (r) { return r.track.toLowerCase() === track; });
        var c = h("div"); if (!t.length) return add(c, h("div", "c", label + ": none"));
        var live = t.filter(function (r) { return pipClass(r.status) === "live"; }).length;
        var built = t.filter(function (r) { return pipClass(r.status) === "built"; }).length;
        var cap = h("div", "c"); add(cap, h("strong", "", label + " " + live + " of " + t.length + " live"));
        if (built) cap.appendChild(document.createTextNode(" · " + built + " built"));
        return add(c, cap, pips(t));
      }
      add(b, add(g, hd, side("Product", "product"), side("Technology", "technology")));
    });
    return b;
  }

  function viewToday() {
    var v = h("div", "view");
    add(v, figures());
    var two = h("div", "two"); add(two, priorities(), waiting());
    return add(v, two, momentum(), goals());
  }

  function viewTrack(track, intro) {
    var v = h("div", "view"), road = items("roadmap").filter(function (r) { return r.track.toLowerCase() === track; });
    add(v, h("p", "muted", intro));
    var seen = [];
    road.forEach(function (r) { if (seen.indexOf(r.horizon) < 0) seen.push(r.horizon); });
    seen.forEach(function (name) {
      var rows = road.filter(function (r) { return r.horizon === name; });
      var b = section(name, rows[0].confidence ? rows[0].confidence.charAt(0).toUpperCase() + rows[0].confidence.slice(1) : null);
      var sc = h("div", "scroll"), tb = h("table"), th = h("thead"), tr = h("tr"), body = h("tbody");
      ["Lane", "Item", "Size", "Status"].forEach(function (c) { add(tr, h("th", "", c)); });
      rows.forEach(function (r) { var row = h("tr"); add(row, h("td", "", r.lane), h("td", "i", r.item), h("td", "n", r.size || "–"), add(h("td"), statusTag(r.status))); add(body, row); });
      add(v, add(b, add(sc, add(tb, add(th, tr), body))));
    });
    var mine = items("projects").filter(function (p) { return p.track === track && p.status !== "closed"; });
    if (mine.length) add(v, projectTable("Projects in this track", mine));
    return v;
  }

  function projectTable(title, list) {
    var b = section(title);
    var sc = h("div", "scroll"), tb = h("table"), th = h("thead"), tr = h("tr"), body = h("tbody");
    ["Project", "Status", "Last change", "This week", "Walks owed", "What remains"].forEach(function (c) { add(tr, h("th", "", c)); });
    list.forEach(function (p) {
      var st = STATUS[p.status] || ["idle", p.status], row = h("tr");
      add(row, add(h("td", "i"), h("span", "", p.name)), add(h("td"), tag(st[0], st[1])),
        h("td", "n", p.last ? day(p.last) + (p.quietDays ? " · " + p.quietDays + "d" : "") : "–"),
        h("td", "n", p.commitsThisWeek + (p.uncommitted ? " +" : "")),
        h("td", "n", p.walksOwed && p.walksOwed.length ? p.walksOwed.map(function (s) { return "§" + s; }).join(" ") : "–"),
        h("td", "", p.remains || (p.auto ? "Not on the project list yet." : "")));
      add(body, row);
    });
    return add(b, add(sc, add(tb, add(th, tr), body)));
  }
  function viewProjects() {
    var v = h("div", "view"), all = items("projects");
    add(v, h("p", "muted", "Every open project, most active first. A plus sign after the weekly count means there is work not yet committed."));
    return add(v, projectTable("All projects (" + all.length + ")", all));
  }

  function header() {
    var m = D.meta, asof = document.getElementById("asof"), stale = document.getElementById("stale");
    if (!m) return;
    var when = new Date(m.generatedAt);
    asof.textContent = "Refreshed " + day(m.date) + " at " + clock(when) + ". " + (m.production ? m.production.commitsLast7Days + " changes made in the past seven days, " + m.production.releasesLast90Days + " releases in the past ninety." : "");
    var age = daysBetween(m.date, todayIso());
    stale.hidden = age < 1;
    if (age >= 1) stale.textContent = "This brief is " + plural(age, "day", "days") + " old. Ask for a refresh before acting on it.";
  }

  var links = document.querySelectorAll(".tabs a");
  function render() {
    var want = (location.hash || "#today").slice(1);
    if (["today", "product", "technology", "projects"].indexOf(want) < 0) want = "today";
    for (var i = 0; i < links.length; i++) { if (links[i].getAttribute("href") === "#" + want) links[i].setAttribute("aria-current", "true"); else links[i].removeAttribute("aria-current"); }
    if (!D.meta) return;
    header();
    main.textContent = "";
    if (want === "today") add(main, viewToday());
    else if (want === "product") add(main, viewTrack("product", "What a club, a coach or a family can do that they could not do before."));
    else if (want === "technology") add(main, viewTrack("technology", "Security, uptime, infrastructure and the promises about data."));
    else add(main, viewProjects());
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  render();

  function fail(msg) { if (D.meta) return; document.getElementById("asof").textContent = ""; document.getElementById("empty").textContent = msg; }
  var timer = setTimeout(function () { fail("The brief's data can't be reached yet. It will appear here by itself when it can."); }, 10000);
  var use = window.claude && window.claude.use;
  if (!use) { clearTimeout(timer); fail("The brief's data is only available when this page is opened in Claude."); return; }

<title>Owner Morning Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the board. Today = figures band, goals, Now (at most three, in order) beside Waiting on you,
   then Next and After launch. Tabs: Goals, Projects, Product, Technology. Every figure and status comes from the
   artifact's database, which a script writes from the board file in the repo; nothing is typed into this page. */
:root {
  --bg: #f5f7f6; --surface: #ffffff; --ink: #17211d; --muted: #5a6862; --line: #d9e1dd;
  --accent: #1f6b4f; --accent-soft: #e2efe9; --tech: #2b5a86; --tech-soft: #e3ecf5;
  --ok: #1f6b4f; --ok-bg: #e2efe9; --warn: #8a5800; --warn-bg: #faefd6; --stop: #a3362a; --stop-bg: #f8e3e0; --idle: #55615c; --idle-bg: #e8ecea;
  --pip-off: #cfd8d3;
  --display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101614; --surface: #171f1c; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
  --accent: #62c69c; --accent-soft: #1b2e26; --tech: #8ab8e6; --tech-soft: #1b2836;
  --ok: #62c69c; --ok-bg: #173026; --warn: #e3b45e; --warn-bg: #33290f; --stop: #ef8d80; --stop-bg: #3a1c18; --idle: #a7b3ae; --idle-bg: #232c29;
  --pip-off: #37433e;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101614; --surface: #171f1c; --ink: #e6ece9; --muted: #9aa8a2; --line: #2a3531;
  --accent: #62c69c; --accent-soft: #1b2e26; --tech: #8ab8e6; --tech-soft: #1b2836;
  --ok: #62c69c; --ok-bg: #173026; --warn: #e3b45e; --warn-bg: #33290f; --stop: #ef8d80; --stop-bg: #3a1c18; --idle: #a7b3ae; --idle-bg: #232c29;
  --pip-off: #37433e;
  color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 0.98rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.head { display: flex; flex-direction: column; gap: 8px; }
.stale { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; font-weight: 500; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-block: -8px; }
.tabs nav { display: flex; gap: 2px 6px; flex-wrap: wrap; padding-block: 8px; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.92rem; padding: 6px 12px; border-radius: 999px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="true"] { background: var(--ink); color: var(--bg); }

.view { display: flex; flex-direction: column; gap: 28px; }
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 32px; }
.even { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
@media (max-width: 820px) { .cols, .two, .even { grid-template-columns: 1fr; } }

.figures { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.figures div { padding: 14px 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.figures div:first-child { border-left: 0; }
.figures b { font-family: var(--display); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.figures span { font-size: 0.84rem; color: var(--muted); }
@media (max-width: 640px) {
  .figures { grid-template-columns: 1fr; }
  .figures div { border-left: 0; border-top: 1px solid var(--line); flex-direction: row; align-items: baseline; gap: 12px; padding: 11px 16px; }
  .figures div:first-child { border-top: 0; }
  .figures b { font-size: 1.25rem; min-width: 3.4ch; }
}

.tag { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }
.tag.ok { color: var(--ok); background: var(--ok-bg); }
.tag.warn { color: var(--warn); background: var(--warn-bg); }
.tag.stop { color: var(--stop); background: var(--stop-bg); }
.tag.idle { color: var(--idle); background: var(--idle-bg); }
.tag.tech { color: var(--tech); background: var(--tech-soft); }

.warnbox { background: var(--stop-bg); color: var(--stop); border-radius: 10px; padding: 12px 16px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
.warnbox ul { margin: 0; padding-left: 1.2rem; }

/* goals: one card per goal, a square per project */
.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gcard.after { background: transparent; border-style: dashed; }
.gcard .gh { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.gcard .gh b { font-family: var(--display); font-size: 1.02rem; }
.gcard .gc { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.gcard .gc strong { color: var(--ink); font-weight: 600; }
.gcard .gd { font-size: 0.82rem; color: var(--muted); }

/* the Now lane: numbered, because the order is the owner's */
ol.prio { list-style: none; margin: 0; padding: 0; counter-reset: p; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
ol.prio li { counter-increment: p; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); padding: 14px 16px 14px 8px; border-top: 1px solid var(--line); }
ol.prio li:first-child { border-top: 0; }
ol.prio li::before { content: counter(p); font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--accent); text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums; }
.card { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .t { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.card .stage { font-size: 0.86rem; color: var(--muted); }
.card .nx { font-size: 0.92rem; }
.card .lbl { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.card .dep { font-size: 0.84rem; color: var(--muted); }
.card .dep.blocked { color: var(--warn); }

ul.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.rows li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
ul.rows .t { font-weight: 500; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
ul.rows .s { color: var(--muted); font-size: 0.85rem; }

.goal { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) minmax(0, 1fr); gap: 6px 20px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.goal:first-of-type { border-top: 1px solid var(--line); }
.goal .h b { font-family: var(--display); display: block; }
.goal .h span { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.pip { width: 14px; height: 14px; border-radius: 3px; background: var(--pip-off); }
.pip.live { background: var(--accent); }
.pip.built { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.pip.prog { background: var(--warn-bg); box-shadow: inset 0 0 0 2px var(--warn); }
.goal .c { font-size: 0.85rem; color: var(--muted); }
.goal .c strong { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .goal { grid-template-columns: 1fr; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); align-items: center; }
.legend .pip { display: inline-block; vertical-align: -2px; margin-right: 5px; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 9px 14px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.i { font-weight: 600; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; color: var(--muted); }

/* the way to act on a line: Open (a real page) and Copy prompt (a line to paste into a fresh chat) */
.acts { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 5px; }
.act { font: inherit; font-size: 0.8rem; font-weight: 600; line-height: 1.2; padding: 6px 12px; min-height: 30px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; }
.act:hover { border-color: var(--accent); }
.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a.act.open { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.act.done { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.prompt-text { font: inherit; font-size: 0.82rem; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
</style>

<div class="wrap">
  <header class="head">
    <span class="eyebrow">FieldLogicHQ · the board</span>
    <h1 id="headline">Morning Brief</h1>
    <p class="muted" id="asof">Loading the latest brief.</p>
    <p class="stale" id="stale" hidden></p>
  </header>

  <div class="tabs"><nav aria-label="Views">
    <a href="#today">Today</a>
    <a href="#goals">Goals</a>
    <a href="#projects">Projects</a>
    <a href="#product">Product</a>
    <a href="#technology">Technology</a>
  </nav></div>

  <main id="main">
    <div class="empty" id="empty">The board shows the goals, the projects being worked on now in order, every step waiting on you, and what comes next. It fills in as soon as the data arrives.</div>
  </main>
</div>

<script>
(function () {
  var D = {};            // docs from the "brief" collection, by id
  var main = document.getElementById("main");
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = String(text); return e; }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function day(iso) { if (!iso) return ""; var p = iso.slice(0, 10).split("-"); return Number(p[2]) + " " + MONTHS[Number(p[1]) - 1]; }
  function clock(d) { var hr = d.getHours(), m = d.getMinutes(); var ap = hr < 12 ? "a.m." : "p.m."; hr = hr % 12 || 12; return hr + ":" + (m < 10 ? "0" : "") + m + " " + ap; }
  function todayIso() { var d = new Date(); var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd; }
  function daysBetween(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function link(url, label) { if (!url || !/^https:\/\//.test(url)) return null; var a = h("a", "", label); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; }
  function tag(cls, text) { return h("span", "tag " + cls, text); }
  function items(id) { return (D[id] && D[id].items) || []; }
  function board() { return D.board || { lanes: { now: [], next: [], later: [], after: [] }, goals: [], youOwe: [], warnings: [], cards: {} }; }

  function proj(id) { var all = items("projects"); for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i]; return null; }
  function nameOf(id) { var p = proj(id); return p ? p.name : id; }
  function isDone(p) { return p && (p.phase === "Live" || p.status === "closed"); }
  var LANE = { now: "Now", next: "Next", later: "Later", after: "After launch" };
  function laneOf(id) { var L = board().lanes || {}; for (var k in LANE) if ((L[k] || []).indexOf(id) >= 0) return k; return null; }
  var PHASE = { "Planning": "idle", "Drawing": "idle", "Asks to rule": "warn", "Building": "tech", "Walk owed": "warn", "Test owed": "warn", "Ready to release": "ok", "Live": "ok", "Parked": "idle" };

  // ---- acting on a line ----
  // Every step and project carries a ready-made prompt for a fresh chat ("/brief do <project>[: <step>]"), which
  // shows what is being decided, takes the answer and writes it onto the board. A real page gets an Open button.
  function promptFor(id, step) { return "/brief do " + id + (step ? ": " + step : ""); }
  function copyText(text, btn, holder) {
    var label = btn.textContent;
    function done(ok) {
      if (ok) { btn.textContent = "Copied. Paste it into a new chat"; btn.classList.add("done"); setTimeout(function () { btn.textContent = label; btn.classList.remove("done"); }, 2600); return; }
      // the browser refused the clipboard: show the line, selected, to copy by hand
      var shown = holder.querySelector(".prompt-text");
      if (!shown) { shown = h("input", "prompt-text"); shown.readOnly = true; shown.value = text; shown.setAttribute("aria-label", "Prompt to copy"); add(holder, shown); }
      shown.focus(); shown.select();
    }
    function legacy() {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta); done(ok);
    }
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { done(true); }, legacy); return; } } catch (e) { /* fall through */ }
    legacy();
  }
  function actions(prompt, url, openLabel) {
    var row = h("div", "acts");
    var a = link(url, openLabel || "Open"); if (a) { a.className = "act open"; add(row, a); }
    var b = h("button", "act", "Copy prompt"); b.type = "button"; b.title = prompt;
    b.addEventListener("click", function () { copyText(prompt, b, row); });
    return add(row, b);
  }
  function walkLink(section) { var ws = items("walks"); for (var i = 0; i < ws.length; i++) if (ws[i].section === section) return ws[i].link; return null; }
  function phaseTag(p) { if (p && p.phase) return tag(PHASE[p.phase] || "idle", p.phase); return p && p.checked === false ? tag("idle", "Not checked yet") : tag("stop", "No phase"); }
  function openDeps(list) { return (list || []).filter(function (w) { return !isDone(proj(w)); }); }
  function phasePip(p) { if (!p) return ""; if (p.phase === "Live" || p.status === "closed") return "live"; if (p.phase === "Ready to release") return "built"; if (["Building", "Walk owed", "Test owed", "Asks to rule"].indexOf(p.phase) >= 0) return "prog"; return ""; }

  var STATUS = { moving: ["ok", "Moving"], waiting: ["warn", "Waiting on you"], quiet: ["stop", "Gone quiet"], parked: ["idle", "Parked"], closed: ["idle", "Closed"] };
  function pipClass(s) { s = (s || "").toLowerCase(); return s === "live" ? "live" : s === "built" ? "built" : s === "in progress" ? "prog" : ""; }
  function statusTag(s) { var c = pipClass(s); return tag(c === "live" ? "ok" : c === "built" ? "ok" : c === "prog" ? "warn" : "idle", s || "Not started"); }

  function section(title, sub) { var b = h("section", "block"); add(b, h("h2", "", title)); if (sub) add(b, h("p", "muted small", sub)); return b; }

  function figures() {
    var p = (D.meta && D.meta.production) || {};
    var f = h("div", "figures");
    function cell(n, label) { var c = h("div"); add(c, h("b", "", n === null || n === undefined ? "–" : n), h("span", "", label)); return c; }
    add(f, cell(p.ahead, "changes not yet live"), cell(p.pendingSteps, "database steps owed to production"),
      cell(p.daysSinceRelease, "days since the last release" + (p.lastRelease ? " (" + day(p.lastRelease) + ")" : "")),
      cell(board().youOwe.length + (D.meta ? D.meta.walksOwed : 0), "steps and walks waiting on you"));
    return f;
  }

  function warningsBox() {
    var w = board().warnings || [];
    if (!w.length) return null;
    var b = h("div", "warnbox"); add(b, h("b", "", "The board breaks its own rules in " + plural(w.length, "place", "places") + ". Fix the board file, then refresh."));
    var ul = h("ul"); w.forEach(function (t) { add(ul, h("li", "", t)); });
    return add(b, ul);
  }

  function goalStrip() {
    var gs = board().goals || [];
    var b = section("Goals");
    if (!gs.length) return add(b, h("p", "muted", "No goals are on the board yet."));
    var g = h("div", "goals");
    gs.forEach(function (x) {
      var c = h("div", "gcard" + (x.after ? " after" : ""));
      add(c, add(h("div", "gh"), h("b", "", x.name), x.after ? tag("idle", "After launch") : null));
      var cap = h("div", "gc"); add(cap, h("strong", "", x.done + " of " + x.total)); cap.appendChild(document.createTextNode(" projects done"));
      var pp = h("div", "pips"); (x.projects || []).forEach(function (id) { var p = proj(id); var s = h("span", "pip " + phasePip(p)); s.title = nameOf(id) + (p && p.phase ? " · " + p.phase : ""); add(pp, s); });
      add(c, cap, pp, x.doneWhen ? h("p", "gd", x.doneWhen) : null);
      add(g, c);
    });
    return add(b, g);
  }

  function card(id) {
    var p = proj(id); if (!p) return h("div", "card", id);
    var c = h("div", "card");
    add(c, add(h("div", "t"), h("span", "", p.name), phaseTag(p)));
    if (p.stage) add(c, h("div", "stage", p.stage));
    if (p.next) { var nx = h("div", "nx"); add(nx, h("span", "lbl", "Next")); nx.appendChild(document.createTextNode(p.next)); add(c, nx); }
    var open = openDeps(p.waitsOn);
    if (open.length) add(c, h("div", "dep blocked", "Blocked until " + open.map(nameOf).join(", ") + " is done"));
    var fin = openDeps(p.finishesAfter);
    if (fin.length) add(c, h("div", "dep", "Can finish only after " + fin.map(nameOf).join(", ")));
    var holds = ((board().cards || {})[id] || {}).blocks || [];
    if (holds.length) add(c, h("div", "dep", "Holds up " + holds.map(nameOf).join(", ")));
    if (p.walksOwed && p.walksOwed.length) {
      var wo = h("div", "dep", plural(p.walksOwed.length, "walk", "walks") + " owed:");
      p.walksOwed.forEach(function (s) { wo.appendChild(document.createTextNode(" ")); add(wo, link(walkLink(s), "§" + s) || h("span", "", "§" + s)); });
      add(c, wo);
    }
    var firstWalk = p.walksOwed && p.walksOwed.length ? walkLink(p.walksOwed[0]) : null;
    add(c, actions(promptFor(id), firstWalk, firstWalk ? "Open walk §" + p.walksOwed[0] : null));
    return c;
  }

  function nowLane() {
    var ids = (board().lanes || {}).now || [];
    var b = section("Now, in this order", "At most three. The order is yours; a project here should not be waiting on another.");
    if (!ids.length) return add(b, h("div", "empty", "Nothing is in Now. Pick up to three projects from Next."));
    var ol = h("ol", "prio");
    ids.forEach(function (id) { add(ol, add(h("li"), card(id))); });
    return add(b, ol);
  }

  function rowList(ids, sub, withActs) {
    var ul = h("ul", "rows");
    ids.forEach(function (id) {
      var p = proj(id), li = h("li");
      add(li, add(h("div", "t"), h("span", "", nameOf(id)), phaseTag(p)));
      var line = sub(p, id); if (line) add(li, h("div", "s", line));
      if (withActs) add(li, actions(promptFor(id)));
      add(ul, li);
    });
    return ul;
  }
  function laneList(key, title, intro) {
    var ids = ((board().lanes || {})[key]) || [];
    var b = section(title + " (" + ids.length + ")", intro);
    if (!ids.length) return add(b, h("p", "muted small", "None."));
    return add(b, rowList(ids, function (p) {
      if (!p) return "";
      var open = openDeps(p.waitsOn), fin = openDeps(p.finishesAfter);
      return (p.next || p.remains || "") + (open.length ? " · blocked until " + open.map(nameOf).join(", ") + " is done" : "") + (fin.length ? " · finishes after " + fin.map(nameOf).join(", ") : "");
    }, key === "next"));
  }

  function waiting() {
    var owe = board().youOwe || [], walks = items("walks");
    var b = section("Waiting on you", plural(owe.length, "step", "steps") + " only you can take, and " + plural(walks.length, "walk", "walks") + ". Steps on Now projects come first.");
    if (owe.length) {
      var ul = h("ul", "rows");
      owe.forEach(function (o) { var li = h("li"); add(li, add(h("div", "t"), h("span", "", o.text)), h("div", "s", o.name + " · " + (LANE[o.lane] || "")), actions(promptFor(o.project, o.text), o.url)); add(ul, li); });
      add(b, ul);
    }
    if (walks.length) {
      add(b, h("h3", "", "Walks"));
      var wl = h("ul", "rows");
      walks.forEach(function (w) {
        var li = h("li"), t = h("div", "t");
        add(t, link(w.link, "§" + w.section) || h("span", "", "§" + w.section), h("span", "", w.title), w.recorded ? null : tag("warn", "No result recorded"));
        var bits = []; if (w.steps) bits.push(w.steps + " steps"); if (w.published) bits.push("published " + day(w.published));
        add(wl, add(li, t, bits.length ? h("div", "s", bits.join(" · ")) : null));
      });
      add(b, wl);
    }
    if (!owe.length && !walks.length) add(b, h("p", "muted", "Nothing is waiting on you."));
    return b;
  }

  function momentum() {
    var all = items("projects");
    var b = section("Momentum", "Worked out from the history of each project's plan. Quiet means no change for more than seven days.");
    var cols = h("div", "cols");
    function col(title, list, line) {
      var c = h("div", "block"); add(c, h("h3", "", title + " (" + list.length + ")"));
      if (!list.length) return add(c, h("p", "muted small", "None."));
      var ul = h("ul", "rows");
      list.forEach(function (p) { var li = h("li"); add(li, add(h("div", "t"), h("span", "", p.name), p.auto ? tag("stop", "Not on the board") : null), h("div", "s", line(p))); add(ul, li); });
      return add(c, ul);
    }
    var moving = all.filter(function (p) { return p.status === "moving"; }).sort(function (a, b2) { return b2.commitsThisWeek - a.commitsThisWeek; });
    var quiet = all.filter(function (p) { return p.status === "quiet" || p.status === "waiting"; });
    var parked = all.filter(function (p) { return p.status === "parked"; });
    add(cols,
      col("Moving this week", moving, function (p) { return plural(p.commitsThisWeek, "change", "changes") + " this week" + (p.uncommitted ? " · work not yet committed" : ""); }),
      col("Gone quiet", quiet, function (p) {
        var s = "Stopped " + plural(p.quietDays, "day", "days") + " ago (" + day(p.last) + ")";
        if (p.overtakenBy && p.overtakenBy.length) s += " · started since: " + p.overtakenBy.join(", ");
        return s; }),
      col("Parked on purpose", parked, function (p) { return (p.parked && p.parked.reason) || "No reason recorded."; }));
    add(b, cols);
    var settled = D.meta ? D.meta.settledNotShown : 0;
    if (settled) add(b, h("p", "muted small", settled + " finished plans with no open task are left off."));
    return b;
  }

  function roadmapProgress() {
    var road = items("roadmap");
    var b = section("Progress against the roadmap", "One square per roadmap item. Counts, not percentages.");
    if (!road.length) return add(b, h("p", "muted", "The roadmap has no items yet."));
    var lg = h("div", "legend");
    [["live", "Live"], ["built", "Built, not yet live"], ["prog", "In progress"], ["", "Not started"]].forEach(function (x) { var s = h("span"); add(s, h("span", "pip " + x[0])); s.appendChild(document.createTextNode(x[1])); add(lg, s); });
    add(b, lg);
    var seen = [];
    road.forEach(function (r) { if (seen.indexOf(r.horizon) < 0) seen.push(r.horizon); });
    seen.forEach(function (name) {
      var rows = road.filter(function (r) { return r.horizon === name; });
      var g = h("div", "goal"), hd = h("div", "h");
      add(hd, h("b", "", name), h("span", "", rows[0].confidence || ""));
      function side(label, track) {
        var t = rows.filter(function (r) { return r.track.toLowerCase() === track; });
        var c = h("div"); if (!t.length) return add(c, h("div", "c", label + ": none"));
        var live = t.filter(function (r) { return pipClass(r.status) === "live"; }).length;
        var built = t.filter(function (r) { return pipClass(r.status) === "built"; }).length;
        var cap = h("div", "c"); add(cap, h("strong", "", label + " " + live + " of " + t.length + " live"));
        if (built) cap.appendChild(document.createTextNode(" · " + built + " built"));
        var pp = h("div", "pips"); t.forEach(function (r) { var p = h("span", "pip " + pipClass(r.status)); p.title = r.item + " · " + r.status; add(pp, p); });
        return add(c, cap, pp);
      }
      add(b, add(g, hd, side("Product", "product"), side("Technology", "technology")));
    });
    return b;
  }

  function viewToday() {
    var v = h("div", "view");
    add(v, figures(), warningsBox(), goalStrip());
    var two = h("div", "two"); add(two, nowLane(), waiting());
    var even = h("div", "even");
    add(even, laneList("next", "Next", "Ready to pick up once something in Now finishes."), laneList("after", "After launch", "Kept so they are not lost; not worked on before the Canadian launch."));
    return add(v, two, even, laneList("later", "Later", null));
  }

  function viewGoals() {
    var v = h("div", "view"), gs = board().goals || [];
    add(v, h("p", "muted", "Each goal and the projects that serve it, in lane order. A project that serves two goals appears under both; finishing it moves both."));
    if (!gs.length) return add(v, h("div", "empty", "No goals are on the board yet."));
    var rank = { now: 0, next: 1, later: 2, after: 3 };
    gs.forEach(function (g) {
      var b = section(g.name + " · " + g.done + " of " + g.total + " done", g.doneWhen || null);
      var ids = (g.projects || []).slice().sort(function (a, c) { var la = laneOf(a), lc = laneOf(c); return (la ? rank[la] : 9) - (lc ? rank[lc] : 9); });
      add(b, rowList(ids, function (p, id) {
        if (!p) return "";
        var L = laneOf(id), open = openDeps(p.waitsOn), fin = openDeps(p.finishesAfter);
        return (isDone(p) ? "Done · " : (L ? LANE[L] + " · " : "")) + (p.next || p.remains || "") + (open.length ? " · blocked until " + open.map(nameOf).join(", ") + " is done" : "") + (fin.length ? " · finishes after " + fin.map(nameOf).join(", ") : "");
      }));
      add(v, b);
    });
    return v;
  }

  function projectTable(title, list) {
    var b = section(title);
    var sc = h("div", "scroll"), tb = h("table"), th = h("thead"), tr = h("tr"), body = h("tbody");
    ["Project", "Phase", "Lane", "Next step", "Depends on", "Walks owed", "Last change"].forEach(function (c) { add(tr, h("th", "", c)); });
    list.forEach(function (p) {
      var row = h("tr"), L = laneOf(p.id);
      var nameCell = add(h("td", "i"), h("div", "", p.name));
      if (p.auto) add(nameCell, tag("stop", "Not on the board"));
      if (p.status === "parked" || p.status === "closed") add(nameCell, tag("idle", STATUS[p.status][1]));
      add(row, nameCell, add(h("td"), p.auto ? null : phaseTag(p)), h("td", "n", L ? LANE[L] : "–"),
        h("td", "", p.next || p.remains || ""),
        h("td", "", openDeps((p.waitsOn || []).concat(p.finishesAfter || [])).map(nameOf).join(", ") || "–"),
        (function () {
          var td = h("td", "n"); if (!p.walksOwed || !p.walksOwed.length) { td.textContent = "–"; return td; }
          p.walksOwed.forEach(function (s, k) { if (k) td.appendChild(document.createTextNode(" ")); add(td, link(walkLink(s), "§" + s) || h("span", "", "§" + s)); });
          return td;
        })(),
        h("td", "n", p.last ? day(p.last) + (p.quietDays ? " · " + p.quietDays + "d" : "") : "–"));
      add(body, row);
    });
    return add(b, add(sc, add(tb, add(th, tr), body)));
  }
  function viewProjects() {
    var v = h("div", "view"), all = items("projects");
    add(v, h("p", "muted", "Every open project. Phase, lane and next step are the board; last change and walks owed are worked out from the record."));
    return add(v, projectTable("All projects (" + all.length + ")", all), momentum());
  }

  function viewTrack(track, intro) {
    var v = h("div", "view"), road = items("roadmap").filter(function (r) { return r.track.toLowerCase() === track; });
    add(v, h("p", "muted", intro));
    if (track === "product") add(v, roadmapProgress());
    var seen = [];
    road.forEach(function (r) { if (seen.indexOf(r.horizon) < 0) seen.push(r.horizon); });
    seen.forEach(function (name) {
      var rows = road.filter(function (r) { return r.horizon === name; });
      var b = section(name, rows[0].confidence ? rows[0].confidence.charAt(0).toUpperCase() + rows[0].confidence.slice(1) : null);
      var sc = h("div", "scroll"), tb = h("table"), th = h("thead"), tr = h("tr"), body = h("tbody");
      ["Lane", "Item", "Size", "Status"].forEach(function (c) { add(tr, h("th", "", c)); });
      rows.forEach(function (r) { var row = h("tr"); add(row, h("td", "", r.lane), h("td", "i", r.item), h("td", "n", r.size || "–"), add(h("td"), statusTag(r.status))); add(body, row); });
      add(v, add(b, add(sc, add(tb, add(th, tr), body))));
    });
    return v;
  }

  function header() {
    var m = D.meta, asof = document.getElementById("asof"), stale = document.getElementById("stale");
    if (!m) return;
    var when = new Date(m.generatedAt);
    asof.textContent = "Refreshed " + day(m.date) + " at " + clock(when) + ". " + (m.production ? m.production.commitsLast7Days + " changes made in the past seven days, " + m.production.releasesLast90Days + " releases in the past ninety." : "");
    var age = daysBetween(m.date, todayIso());
    stale.hidden = age < 1;
    if (age >= 1) stale.textContent = "This brief is " + plural(age, "day", "days") + " old. Ask for a refresh before acting on it.";
  }

  var VIEWS = ["today", "goals", "projects", "product", "technology"];
  var links = document.querySelectorAll(".tabs a");
  function render() {
    var want = (location.hash || "#today").slice(1);
    if (VIEWS.indexOf(want) < 0) want = "today";
    for (var i = 0; i < links.length; i++) { if (links[i].getAttribute("href") === "#" + want) links[i].setAttribute("aria-current", "true"); else links[i].removeAttribute("aria-current"); }
    if (!D.meta) return;
    header();
    main.textContent = "";
    if (want === "today") add(main, viewToday());
    else if (want === "goals") add(main, viewGoals());
    else if (want === "projects") add(main, viewProjects());
    else if (want === "product") add(main, viewTrack("product", "What a club, a coach or a family can do that they could not do before."));
    else add(main, viewTrack("technology", "Security, uptime, infrastructure and the promises about data."));
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  render();

  function fail(msg) { if (D.meta) return; document.getElementById("asof").textContent = ""; document.getElementById("empty").textContent = msg; }
  var timer = setTimeout(function () { fail("The brief's data can't be reached yet. It will appear here by itself when it can."); }, 10000);
  var use = window.claude && window.claude.use;
  if (!use) { clearTimeout(timer); fail("The brief's data is only available when this page is opened in Claude."); return; }
  window.claude.use("db").then(function (db) {
    if (!db) { clearTimeout(timer); fail("The brief's data is not available in this view. Open it signed in to Claude."); return; }
    db.collection("brief").onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (d) { if (d.exists) next[d.id] = d.data(); });
      D = next;
      if (D.meta) clearTimeout(timer);
      else if (!snap.metadata.fromCache) { clearTimeout(timer); fail("No brief has been written yet. Ask for a refresh."); }
      render();
    }, function () { clearTimeout(timer); fail("The brief's data could not be loaded."); });
  });
})();
</script>

    parts.forEach(function (p) { if (p.calls) return; var c = partCount(p); n += c.n; of += c.of; });
    return { n: n, of: of };
  }
  function renderCount() { var t = totals(); countEl.textContent = t.n + " of " + t.of + " steps ticked"; }

  var order = ["start"].concat(parts.map(function (p) { return p.id; })).concat(["paste"]);
  function renderTabs() {
    tabsEl.innerHTML = "";
    order.forEach(function (id) {
      var label, dot = "";

      else if (id === "paste") label = "Paste back";
      else { var p = parts.filter(function (x) { return x.id === id; })[0]; label = p.id + " · " + p.title; var v = state.verdict[id]; var c = partCount(p); dot = v ? v : (c.n > 0 ? "part" : ""); }
      var b = el("button", { "class": "tab", role: "tab", "aria-selected": String(state.tab === id), text: label, onclick: function () { go(id); } });
      if (dot !== "" || (id !== "start" && id !== "paste")) b.appendChild(el("span", { "class": "dot " + dot }));
      tabsEl.appendChild(b);
    });
  }
  function go(id) { state.tab = id; save(); render(); window.scrollTo(0, 0); }

  function cred(label, value) {
    var b = el("button", { "class": "copy", type: "button", text: "Copy", onclick: function () {

    } });

  }

  function renderStart() {
    var team = "4979621e-58a7-4859-9d9c-ee1f63580be7";

    var c1 = el("div", { "class": "cred" });
    [].concat(cred("Site", "http://localhost:3000"), cred("Head coach", "s3-walk-coach@dev.local"), cred("Password", "devpass123"), cred("Roster", base + "/roster"), cred("Tryouts", base + "/tryouts?stage=decide")).forEach(function (n) { c1.appendChild(n); });
    var c2 = el("div", { "class": "cred" });
    [].concat(cred("Assistant", "s3-walk-assistant@dev.local"), cred("Password", "devpass123")).forEach(function (n) { c2.appendChild(n); });
    var c3 = el("div", { "class": "cred" });
    [].concat(
      cred("Reset (part I)", "node --env-file=.env.local .probe/s3-walk/fixture.mjs --reset"),
      cred("Verify", "node --env-file=.env.local .probe/s3-walk/verify.mjs")
    ).forEach(function (n) { c3.appendChild(n); });

    var who = el("div", { "class": "scroll" }, [el("table", null, [
      el("thead", null, [el("tr", null, [el("th", { text: "Player" }), el("th", { text: "Where they are" }), el("th", { text: "What it is for" })])]),
      el("tbody", null, [
        row("Liam #2 · Ella #3 · Noah #4 · Mason #7 · Lucas #8 · Wyatt #14", "On the 2026 roster (and last season’s)", "The six who rolled. Never listed in the picker."),
        row("Jonah Reyes #5", "2025 only, inactive", "Left, comes back: picker + “Back from…”."),
        row("Theo Lindqvist #20", "2025 only, call-up (3 games)", "A call-up comes back: picker + “Back from…”."),
        row("Sam Okoye #12", "2025 only, born 2012, dues settled", "Add Player question, birth-year warning, a remembered No."),
        row("Owen Fischer #15", "2025 only, active", "Paste a list: Same child."),
        row("Priya Shah #7", "2024 only, $120.00 owing", "The picker’s dues chip; a tryout sign-up has her name."),
        row("Mia Chen · Ella Brooks · Priya Shah", "Offered tryout sign-ups, 2026", "Plain accept · already on the roster by name · Same child?")
      ])
    ])]);
    function row(a, b, c) { return el("tr", null, [el("td", { text: a }), el("td", { text: b }), el("td", { text: c })]); }

    return [
      el("h2", { text: "A returning child is picked, never retyped" }),
      el("p", { "class": "lede", text: "As of " + data.asOf + ". Dev site only; keep this page private (it carries a dev password)." }),
      el("div", { "class": "panel" }, [el("h3", { text: "What this walk is for" }), el("p", { text: "To check that a coach can bring a player from an earlier season back from one picker, that typing or pasting a name that matches a past player asks “Same child?” once, that accepting a tryout sign-up never puts one child on a roster twice, and that a No is remembered. It is one job, in nine parts, about 40 steps." })]),
      el("div", { "class": "panel" }, [el("h3", { text: "It passes when" }), el("ul", { "class": "plain" }, [
        el("li", { text: "A past player comes back with their history and is never retyped." }),
        el("li", { text: "Every door asks before adding a same-name player, and a No is not asked twice." }),
        el("li", { text: "No path puts the same child on a season’s roster twice." }),
        el("li", { text: "An assistant sees no way to add or bring back anyone." })
      ])]),
      el("div", { "class": "panel" }, [el("h3", { text: "Not in this walk" }), el("ul", { "class": "plain" }, [
        el("li", { text: "A board confirm that would join two children who are both on this season’s roster. It needs two children already on one season, which this fixture cannot make; a database test and a unit test cover it." }),
        el("li", { text: "The club’s own accept refusing a child already on the roster (club side, covered by tests)." }),
        el("li", { text: "Player documents (S4), the child’s own page (S5) and the club’s Children queue (S6)." })
      ])]),
      el("div", { "class": "panel" }, [el("h3", { text: "Sign in as (head coach)" }), c1]),
      el("div", { "class": "panel" }, [el("h3", { text: "Sign in as (assistant, part G only)" }), c2]),
      el("div", { "class": "panel" }, [el("h3", { text: "Who is where on this fixture" }), who]),
      el("div", { "class": "panel" }, [el("h3", { text: "Commands (only part I needs them)" }), c3,
        el("p", { "class": "small", text: "Run them from the repository folder in a terminal. A reset gives the team a new id, so the links above stop working; the reset prints the new ones and saves them in the CREDENTIALS file in the fixture folder." })]),
      el("div", { "class": "callout", html: "<b>Writing parts.</b> C, D, E, F and I change the fixture and later parts depend on earlier ones (Sam, Owen and Priya are used once each). Walk them in order. The walk can be stopped after part H without any harm." }),
      el("div", { "class": "nav" }, [el("span"), el("button", { "class": "primary", type: "button", text: "Start with part A", onclick: function () { go("A"); } })])
    ];
  }

  function renderPart(p) {
    var out = [];
    out.push(el("h2", { text: p.id + " · " + p.title }));
    out.push(el("p", { "class": "lede", text: p.intro }));
    if (p.steps) {
      var ol = el("ol", { "class": "steps" });
      p.steps.forEach(function (s, i) {
        var id = p.id + (i + 1);
        var cb = el("input", { type: "checkbox", id: "cb-" + id, "aria-label": "Step " + id + " done", onchange: function (e) { state.ticks[id] = e.target.checked; save(); render(true); } });
        cb.checked = !!state.ticks[id];
        var body = el("div", { "class": "body" }, [
          el("div", { "class": "id" }, [el("span", { "class": "who", text: s.who }), id]),
          doEl(s.do),
          el("div", { "class": "see" }, [el("b", { "class": "lbl", text: "You should see" }), document.createTextNode(s.see)])
        ]);
        if (s.writes) body.appendChild(el("div", { "class": "writes", text: s.writes }));
        if (s.stop) body.appendChild(el("div", { "class": "callout stop", text: s.stop }));
        ol.appendChild(el("li", { "class": "step" + (state.ticks[id] ? " done" : "") }, [cb, body]));
      });
      out.push(ol);
    }
    if (p.calls) {
      p.calls.forEach(function (c, i) {
        var box = el("div", { "class": "panel" }, [el("p", { text: c.q })]);
        var opts = el("div", { "class": "opts" });
        c.opts.forEach(function (o, j) {
          var id = p.id + (i + 1) + "." + (j + 1);
          var cb = el("input", { type: "checkbox", id: "cb-" + id, onchange: function (e) { state.ticks[id] = e.target.checked; save(); render(true); } });
          cb.checked = !!state.ticks[id];
          opts.appendChild(el("label", { "class": "opt", "for": "cb-" + id }, [cb, el("span", { text: o })]));
        });
        box.appendChild(opts);
        out.push(box);
      });
    }
    out.push(signoff(p));
    var idx = order.indexOf(p.id);
    out.push(el("div", { "class": "nav" }, [
      el("button", { "class": "vbtn", type: "button", text: "← Back", onclick: function () { go(order[idx - 1]); } }),
      el("button", { "class": "primary", type: "button", text: idx === order.length - 2 ? "To the paste-back →" : "Next part →", onclick: function () { go(order[idx + 1]); } })
    ]));
    return out;
  }
  function doEl(text) {
    var d = el("div", { "class": "do" }, [el("b", { "class": "lbl", text: "Do" })]);
    String(text).split("\n").forEach(function (line, i) {
      if (i > 0) d.appendChild(el("br"));
      if (i > 0) d.appendChild(el("code", { text: line })); else d.appendChild(document.createTextNode(line));
    });
    return d;
  }
  function signoff(p) {
    var c = partCount(p);
    var v = el("div", { "class": "verdict" });
    [["pass", "Pass"], ["issue", "Issue"], ["call", "Needs a call"]].forEach(function (pair) {
      v.appendChild(el("button", { "class": "vbtn " + pair[0], type: "button", "aria-pressed": String(state.verdict[p.id] === pair[0]), text: pair[1], onclick: function () {
        state.verdict[p.id] = state.verdict[p.id] === pair[0] ? "" : pair[0]; save(); render(true);
      } }));
    });
    var ta = el("textarea", { id: "notes-" + p.id, "aria-label": "Notes for part " + p.id, placeholder: "Notes: what you saw, what looked wrong, the why behind a call." });
    ta.value = state.notes[p.id] || "";
    ta.addEventListener("input", function () { state.notes[p.id] = ta.value; save(); });
    return el("div", { "class": "panel" }, [el("h3", { text: "Part " + p.id + " · " + c.n + " of " + c.of + " ticked" }), v, ta]);
  }

  function buildPasteBack() {
    var t = totals();
    var lines = ["§455 Stage 14 S3 walk · " + data.asOf + " · ticked " + t.n + " of " + t.of + " steps"];
    parts.forEach(function (p) {
      var c = partCount(p);
      var v = (state.verdict[p.id] || "no verdict").toUpperCase();
      if (p.calls) {
        lines.push("");
        lines.push(p.id + " · " + p.title + " [" + v + "]");
        p.calls.forEach(function (call, i) {
          var picked = call.opts.filter(function (o, j) { return state.ticks[p.id + (i + 1) + "." + (j + 1)]; });
          lines.push("  " + p.id + (i + 1) + ": " + (picked.length ? picked.join(" + ") : "NOT ANSWERED") + "  (" + call.q.slice(0, 70) + "…)");
        });
      } else {
        lines.push("");
        lines.push(p.id + " · " + p.title + " [" + v + "] " + c.n + "/" + c.of);
        var missed = [];
        (p.steps || []).forEach(function (s, i) { if (!state.ticks[p.id + (i + 1)]) missed.push(p.id + (i + 1)); });
        if (missed.length) lines.push("  not ticked: " + missed.join(", "));
      }
      if ((state.notes[p.id] || "").trim()) lines.push("  notes: " + state.notes[p.id].trim().replace(/\n/g, " / "));
    });
    lines.push("");
    lines.push("Reminder: the fraction is the evidence; a verdict is an opinion.");
    return lines.join("\n");
  }
  function renderPaste() {
    var ta = el("textarea", { "class": "pb", id: "pb-out", readonly: "readonly", "aria-label": "Paste-back text" });
    ta.value = buildPasteBack();
    var msg = el("span", { "class": "small", id: "pb-msg" });
    var copyBtn = el("button", { "class": "primary", type: "button", text: "Copy the paste-back", onclick: function () {
      ta.value = buildPasteBack();
      var fail = function () { ta.focus(); ta.select(); msg.textContent = "Select and copy it by hand."; };
      try { navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = "Copied. Paste it into the chat."; }, fail); } catch (e) { fail(); }
    } });
    var reset = el("button", { "class": "vbtn", type: "button", text: "Clear every tick and note", onclick: function () {
      if (!state._confirm) { state._confirm = true; reset.textContent = "Press again to clear everything"; return; }
      state.ticks = {}; state.verdict = {}; state.notes = {}; state._confirm = false; save(); render();
    } });
    return [
      el("h2", { text: "Paste back" }),
      el("p", { "class": "lede", text: "Copy this into the chat when you finish, or when you stop. It carries the count per part, the verdicts, your notes and your answers to the calls." }),
      ta,
      el("div", { "class": "nav" }, [el("div", { "class": "verdict" }, [copyBtn, msg]), reset])
    ];
  }

  function render(keepScroll) {
    var y = window.scrollY;
    renderTabs(); renderCount();
    mainEl.innerHTML = "";
    var nodes;
    if (state.tab === "start") nodes = renderStart();
    else if (state.tab === "paste") nodes = renderPaste();
    else { var p = parts.filter(function (x) { return x.id === state.tab; })[0]; nodes = p ? renderPart(p) : renderStart(); }
    nodes.forEach(function (n) { mainEl.appendChild(n); });
    if (keepScroll === true) window.scrollTo(0, y);
  }
  render();
})();
</script>
